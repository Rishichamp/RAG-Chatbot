<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chatbot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
    --border: #e2e5eb; --accent: #2f6fde; --accent-text: #ffffff;
    --user: #e8f0fe; --bot: #ffffff; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #9aa3b5;
      --border: #2b313c; --accent: #5b8ff0; --accent-text: #0d1117;
      --user: #22304a; --bot: #1f242d; --danger: #ef7b6c;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  aside { width: 260px; border-right: 1px solid var(--border); background: var(--panel);
          display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  aside h1 { font-size: 17px; margin: 0; }
  aside p { margin: 0; color: var(--muted); font-size: 13px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); padding: 8px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #chatList { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #chatList li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chatList li.active { background: var(--user); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
           font-size: 14px; color: var(--muted); }
  header strong { color: var(--text); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
         white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg .src { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .notice { color: var(--muted); text-align: center; font-size: 14px; margin: auto; max-width: 420px; }
  .error { color: var(--danger); }
  #upload { margin: auto; text-align: center; padding: 32px; border: 2px dashed var(--border);
            border-radius: 14px; max-width: 440px; }
  #upload p { color: var(--muted); }
  form#ask { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border);
             background: var(--panel); }
  form#ask input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px;
                   border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--border); max-height: 34vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>RAG Chatbot</h1>
  <p>One document per chat. Answers come only from that document.</p>
  <button class="primary" id="newChat">+ New chat</button>
  <ul id="chatList"></ul>
  <p>Chats are kept for a while in memory and reset when the server restarts.</p>
</aside>
<main>
  <header id="title">Start a new chat to upload a document.</header>
  <div id="messages"></div>
  <form id="ask" hidden>
    <input id="question" maxlength="2000" placeholder="Ask about this document…" autocomplete="off">
    <button class="primary" id="send">Send</button>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const STORE = "rag-chats";
let current = null;      // {chat_id, document, history}
let busy = false;

function savedChats() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; }
}
function saveChats(list) {
  try { localStorage.setItem(STORE, JSON.stringify(list.slice(0, 30))); } catch {}
}
function rememberChat(id, label) {
  const list = savedChats().filter((c) => c.id !== id);
  list.unshift({ id, label });
  saveChats(list);
}
function forgetChat(id) { saveChats(savedChats().filter((c) => c.id !== id)); }

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = typeof body.detail === "string" ? body.detail : "Something went wrong.";
    const err = new Error(detail); err.status = res.status; throw err;
  }
  return body;
}

function renderList() {
  const ul = $("chatList"); ul.textContent = "";
  for (const c of savedChats()) {
    const li = document.createElement("li");
    li.textContent = c.label || "New chat (no document)";
    if (current && current.chat_id === c.id) li.className = "active";
    li.onclick = () => openChat(c.id);
    ul.appendChild(li);
  }
}

function addMessage(role, text, sources) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "src";
    s.textContent = "Sources: " + sources.map((x) => `${x.file} p.${x.page}`).join(", ");
    div.appendChild(s);
  }
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

function render() {
  const box = $("messages"); box.textContent = "";
  renderList();
  if (!current) {
    $("title").textContent = "Start a new chat to upload a document.";
    $("ask").hidden = true;
    const n = document.createElement("div"); n.className = "notice";
    n.textContent = "Click “+ New chat”, upload one PDF or TXT file, then ask questions about it.";
    box.appendChild(n);
    return;
  }
  if (!current.document) {
    $("title").textContent = "New chat — upload one document to begin.";
    $("ask").hidden = true;
    const up = document.createElement("div"); up.id = "upload";
    up.innerHTML = "<h3>Upload one document</h3><p>PDF or TXT. This chat will answer only from it. " +
      "To use a different document later, start a new chat.</p>";
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".pdf,.txt"; input.id = "file";
    const status = document.createElement("p"); status.id = "uploadStatus";
    input.onchange = () => input.files[0] && uploadFile(input.files[0], status, input);
    up.append(input, status); box.appendChild(up);
    return;
  }
  $("title").innerHTML = "";
  $("title").append("Chatting about ", Object.assign(document.createElement("strong"),
    { textContent: current.document }), " — start a new chat for another document.");
  $("ask").hidden = false;
  if (!current.history.length) {
    const n = document.createElement("div"); n.className = "notice";
    n.textContent = "Document ready. Ask your first question below.";
    box.appendChild(n);
  }
  for (const t of current.history) { addMessage("user", t.human); addMessage("bot", t.ai); }
  $("question").focus();
}

async function newChat() {
  try {
    current = await api("/chats", { method: "POST" });
    rememberChat(current.chat_id, "");
    render();
  } catch (e) { alert(e.message); }
}

async function openChat(id) {
  try {
    current = await api(`/chats/${encodeURIComponent(id)}`);
    render();
  } catch (e) {
    if (e.status === 404) { forgetChat(id); current = null; render(); alert(e.message); }
    else alert(e.message);
  }
}

async function uploadFile(file, status, input) {
  input.disabled = true;
  status.className = ""; status.textContent = `Reading and indexing ${file.name}…`;
  const form = new FormData(); form.append("file", file);
  try {
    const info = await api(`/chats/${current.chat_id}/document`, { method: "POST", body: form });
    current = info;
    rememberChat(info.chat_id, info.document);
    render();
  } catch (e) {
    status.className = "error"; status.textContent = e.message; input.disabled = false; input.value = "";
  }
}

$("ask").onsubmit = async (ev) => {
  ev.preventDefault();
  const q = $("question").value.trim();
  if (!q || busy || !current) return;
  busy = true; $("send").disabled = true; $("question").value = "";
  const notice = $("messages").querySelector(".notice"); if (notice) notice.remove();
  addMessage("user", q);
  const pending = addMessage("bot", "Thinking…");
  try {
    const r = await api(`/chats/${current.chat_id}/messages`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    pending.remove(); addMessage("bot", r.answer, r.sources);
    current.history.push({ human: q, ai: r.answer });
  } catch (e) {
    pending.textContent = e.message; pending.classList.add("error");
  } finally { busy = false; $("send").disabled = false; }
};

$("newChat").onclick = newChat;
const last = savedChats()[0];
if (last) openChat(last.id); else render();
</script>
</body>
</html>
